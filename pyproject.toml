[project]
name = "gravity-api-service"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "plotly==6.3.0",
    "requests==2.32.5",
]

[tool.fastapi]
entrypoint = "api:app"

[tool.setuptools]
py-modules = ["api", "gravity_backend", "gravity_map", "check_api"]
